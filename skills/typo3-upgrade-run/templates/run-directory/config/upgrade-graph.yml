  - { id: epoch-pass, from: target-content-epoch, outcome: pass, to: [http-dom-proof, visual-proof, component-sentinels, backend-operations, axe-proof, lighthouse-proof] }
  - { id: epoch-invalid, from: target-content-epoch, outcome: invalid, to: content-ledger-recovery }
