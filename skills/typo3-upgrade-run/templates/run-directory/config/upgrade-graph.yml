  - { id: rung14-pass, from: rung-14, outcome: pass, to: [content-blocks, vite-assets, solr-search, structured-data-parity, webmcp-parity, rte-visual-editor] }
  - { id: rung14-findings, from: rung-14, outcome: findings, to: rung14-recovery }
  - { id: rung14-blocked, from: rung-14, outcome: blocked, to: stopped }
  - { id: rung13-retry, from: rung13-recovery, outcome: pass, to: rung-13, retry: true, max_traversals: 2 }
  - { id: rung13-recovery-blocked, from: rung13-recovery, outcome: blocked, to: stopped }
  - { id: mechanical-retry, from: mechanical-recovery, outcome: pass, to: mechanical-migration, retry: true, max_traversals: 2 }
  - { id: mechanical-recovery-blocked, from: mechanical-recovery, outcome: blocked, to: stopped }
  - { id: manual-retry, from: manual-recovery, outcome: pass, to: manual-migration, retry: true, max_traversals: 2 }
  - { id: manual-recovery-blocked, from: manual-recovery, outcome: blocked, to: stopped }
  - { id: rung14-retry, from: rung14-recovery, outcome: pass, to: rung-14, retry: true, max_traversals: 2 }
  - { id: rung14-recovery-blocked, from: rung14-recovery, outcome: blocked, to: stopped }
  - { id: cb-pass, from: content-blocks, outcome: pass, to: migration-join }
  - { id: cb-na, from: content-blocks, outcome: not-applicable, to: migration-join }
  - { id: cb-blocked, from: content-blocks, outcome: blocked, to: stopped }
  - { id: vite-pass, from: vite-assets, outcome: pass, to: migration-join }
  - { id: vite-na, from: vite-assets, outcome: not-applicable, to: migration-join }
  - { id: vite-blocked, from: vite-assets, outcome: blocked, to: stopped }
  - { id: solr-pass, from: solr-search, outcome: pass, to: migration-join }
  - { id: solr-na, from: solr-search, outcome: not-applicable, to: migration-join }
