schema: typo3-upgrade-run/graph@1
id: typo3-14.3-project-upgrade
policy:
  require_artifacts: true
  require_forecast: true
  require_feature_contracts: true
  serialize_mutations: true
  shared_proof_reads: true
  max_node_attempts: 3
  max_total_retries: 12

# Shared readers inspect one frozen version; writes and quiet measurements are exclusive.
resources:
  - project-write
  - machine-load
  - browser-proof
  - composer
  - ddev-stateful
  - solr-core
  - backend-session

start: [intake]
terminal: [handover, stopped]

nodes:
  intake:
    skill: typo3-upgrade-intake
    phase: P00
    outcomes: [pass, blocked]

  project-identity:
    skill: typo3-upgrade-intake
    phase: P00
    outcomes: [pass, findings, blocked]
  dataset-freshness:
    skill: typo3-upgrade-intake
    phase: P00
    resources: [ddev-stateful]
    outcomes: [pass, findings, blocked]
  extension-inventory:
    skill: typo3-upgrade-intake
    phase: P00
    outcomes: [pass, blocked]
  url-discovery:
    skill: typo3-upgrade-intake
    phase: P00
    resources: [browser-proof]
    outcomes: [pass, findings, blocked]
  backend-group-model-decision:
    skill: typo3-backend-rights
    phase: P00
    outcomes: [pass, not-applicable, blocked]
  structured-data-inventory:
    skill: typo3-structured-data
    phase: P00
    resources: [browser-proof]
    outcomes: [pass, blocked]
  webmcp-inventory:
    skill: typo3-webmcp
    phase: P00
    resources: [browser-proof]
    outcomes: [pass, blocked]

  identity-recovery:
    skill: typo3-upgrade-intake
    phase: P00
    outcomes: [pass, blocked]
  data-recovery:
    skill: typo3-upgrade-intake
    phase: P01
    # Request/verify an authorized local dataset; live sync remains a separate task.
    resources: [ddev-stateful]
    outcomes: [pass, blocked]
  sitemap-recovery:
    skill: typo3-upgrade-intake
    phase: P00
    # Inspect fallback discovery only. Site repairs wait until Baseline A exists.
    outcomes: [pass, not-applicable, blocked]
  degraded-discovery:
    skill: typo3-upgrade-intake
    phase: P00
    outcomes: [pass, blocked]

  intake-join:
    phase: P01
    requires: [project-identity, dataset-freshness, extension-inventory, url-discovery, backend-group-model-decision, structured-data-inventory, webmcp-inventory]
    outcomes: [pass, blocked]

  deterministic-baseline:
    skill: typo3-upgrade-baseline
    phase: P02
    resources: [browser-proof]
    evidence_loop: required
    outcomes: [pass, invalid, harness-error, blocked]
  determinism-recovery:
    skill: typo3-upgrade-baseline
    phase: P02
    mutation: code
    resources: [browser-proof]
    outcomes: [pass, blocked]
  harness-recovery:
    skill: typo3-upgrade-baseline
    phase: P02
    mutation: code
    resources: [browser-proof]
    outcomes: [pass, blocked]

  dependency-plan:
    skill: typo3-upgrade-migration
    phase: P05
    resources: [composer]
    outcomes: [pass, findings, blocked]
  dependency-resolution:
    skill: typo3-upgrade-migration
    phase: P05
    mutation: code
    resources: [composer]
    outcomes: [pass, blocked]
  rung-13:
    skill: typo3-upgrade-migration
    phase: P06
    mutation: stateful
    resources: [composer, ddev-stateful]
    evidence_loop: required
    outcomes: [pass, findings, blocked]
  mechanical-migration:
    skill: typo3-upgrade-migration
    phase: P07
    mutation: code
    resources: [composer]
    evidence_loop: required
    outcomes: [pass, findings, blocked]
  manual-migration:
    skill: typo3-upgrade-migration
    phase: P08
    mutation: stateful
    resources: [ddev-stateful]
    evidence_loop: required
    outcomes: [pass, findings, blocked]
  rung-14:
    skill: typo3-upgrade-migration
    phase: P09
    mutation: stateful
    resources: [composer, ddev-stateful]
    evidence_loop: required
    outcomes: [pass, findings, blocked]
  rung13-recovery:
    skill: typo3-upgrade-migration
    phase: P06
    outcomes: [pass, blocked]
  mechanical-recovery:
    skill: typo3-upgrade-migration
    phase: P07
    outcomes: [pass, blocked]
  manual-recovery:
    skill: typo3-upgrade-migration
    phase: P08
    outcomes: [pass, blocked]
  rung14-recovery:
    skill: typo3-upgrade-migration
    phase: P09
    outcomes: [pass, blocked]

  content-blocks:
    skill: typo3-content-blocks
    phase: P08
    mutation: stateful
    resources: [ddev-stateful]
    outcomes: [pass, not-applicable, blocked]
  vite-assets:
    skill: typo3-vite
    phase: P10
    mutation: code
    outcomes: [pass, not-applicable, blocked]
  solr-search:
    skill: typo3-solr
    phase: P10
    mutation: stateful
    resources: [ddev-stateful, solr-core]
    outcomes: [pass, not-applicable, blocked]
  structured-data-parity:
    skill: typo3-structured-data
    phase: P10
    mutation: code
    resources: [browser-proof]
    requires: [structured-data-inventory, rung-14]
    outcomes: [pass, findings, not-applicable, blocked]
  structured-data-recovery:
    skill: typo3-structured-data
    phase: P10
    mutation: code
    resources: [browser-proof]
    outcomes: [pass, blocked]
  webmcp-parity:
    skill: typo3-webmcp
    phase: P10
    mutation: code
    resources: [browser-proof]
    requires: [webmcp-inventory, rung-14]
    outcomes: [pass, findings, not-applicable, blocked]
  webmcp-recovery:
    skill: typo3-webmcp
    phase: P10
    mutation: code
    resources: [browser-proof]
    outcomes: [pass, blocked]
  redirects-rights-single-group:
    skill: typo3-backend-rights
    phase: P10
    mutation: stateful
    resources: [ddev-stateful, backend-session]
    approval: required
    requires: [rung-14]
    outcomes: [pass, blocked]
  redirects-rights-preserved-groups:
    skill: typo3-backend-rights
    phase: P10
    mutation: stateful
    resources: [ddev-stateful, backend-session]
    requires: [rung-14]
    outcomes: [pass, blocked]
  redirects-rights-merge:
    phase: P10
    outcomes: [pass, blocked]
  rte-visual-editor:
    # CKEditor is the default RTE owner; delegate inline editing only when installed.
    skill: typo3-ckeditor5
    phase: P10
    mutation: stateful
    resources: [ddev-stateful, backend-session]
    outcomes: [pass, not-applicable, blocked]

  migration-join:
    phase: P10
    requires: [content-blocks, vite-assets, solr-search, structured-data-parity, webmcp-parity, redirects-rights-merge, rte-visual-editor]
    outcomes: [pass, blocked]
  target-content-epoch:
    skill: typo3-upgrade-closure
    phase: P11
    resources: [ddev-stateful]
    outcomes: [pass, invalid, blocked]
  content-ledger-recovery:
    skill: typo3-upgrade-closure
    phase: P11
    outcomes: [pass, blocked]

  http-dom-proof:
    freeze: true
    skill: typo3-upgrade-closure
    phase: P11
    evidence_loop: required
    outcomes: [pass, findings, invalid, harness-error, blocked]
  visual-proof:
    freeze: true
    skill: typo3-upgrade-closure
    phase: P11
    resources: [browser-proof]
    evidence_loop: required
    outcomes: [pass, findings, invalid, harness-error, blocked]
  component-sentinels:
    freeze: true
    skill: typo3-playwright
    phase: P11
    # Real form submissions may write canonical data. Only an intake-approved,
    # isolated fixture clone may tailor this to a shared-read browser lane.
    resources: [project-write, browser-proof]
    outcomes: [pass, findings, invalid, blocked]
  backend-operations:
    freeze: true
    skill: typo3-upgrade-closure
    phase: P12
    resources: [project-write, backend-session]
    outcomes: [pass, findings, invalid, blocked]
  axe-proof:
    freeze: true
    skill: typo3-upgrade-closure
    phase: P12
    read_resources: [browser-proof]
    outcomes: [pass, findings, invalid, harness-error, blocked]
  lighthouse-proof:
    freeze: true
    quiet: true
    skill: typo3-upgrade-closure
    phase: P12
    resources: [browser-proof]
    requires: [http-dom-proof, visual-proof, component-sentinels, backend-operations, axe-proof]
    outcomes: [pass, findings, invalid, harness-error, blocked]
  lighthouse-axe:
    # Compatibility join: both independent quality proofs remain mandatory.
    phase: P12
    requires: [axe-proof, lighthouse-proof]
    outcomes: [pass, findings, invalid, harness-error, blocked]

  markup-recovery:
    skill: typo3-upgrade-closure
    phase: P11
    mutation: code
    outcomes: [http, visual, blocked]
  visual-classify:
    skill: typo3-upgrade-closure
    phase: P11
    outcomes: [css, assets, markup, content, session, harness, blocked]
  css-recovery:
    skill: typo3-vite
    phase: P11
    mutation: code
    outcomes: [pass, blocked]
  asset-recovery:
    skill: typo3-vite
    phase: P11
    mutation: code
    outcomes: [pass, blocked]
  content-recovery:
    skill: typo3-upgrade-migration
    phase: P11
    mutation: stateful
    resources: [ddev-stateful]
    outcomes: [pass, blocked]
  session-recovery:
    skill: typo3-upgrade-baseline
    phase: P11
    mutation: code
    resources: [browser-proof]
    outcomes: [pass, blocked]
  interaction-recovery:
    skill: typo3-upgrade-closure
    phase: P11
    mutation: code
    outcomes: [pass, blocked]
  backend-recovery:
    skill: typo3-backend-rights
    phase: P12
    mutation: stateful
    resources: [ddev-stateful, backend-session]
    outcomes: [pass, blocked]
  quality-recovery:
    skill: typo3-upgrade-closure
    phase: P12
    mutation: code
    outcomes: [pass, blocked]
  closure-harness-recovery:
    skill: typo3-upgrade-closure
    phase: P11
    mutation: code
    resources: [browser-proof]
    outcomes: [http, visual, component, backend, quality, contract, reproof, blocked]
  closure-reconcile:
    skill: typo3-upgrade-closure
    phase: P13
    outcomes: [pass, reproof, blocked]

  closure-join:
    skill: typo3-upgrade-closure
    phase: P13
    requires: [http-dom-proof, visual-proof, component-sentinels, backend-operations, lighthouse-axe]
    outcomes: [pass, blocked]
  contract-a-gate:
    skill: typo3-upgrade-closure
    phase: P13
    evidence_loop: required
    outcomes: [pass, findings, invalid, blocked]
  structured-data-enrichment:
    skill: typo3-structured-data
    phase: P14
    mutation: stateful
    resources: [composer, ddev-stateful, browser-proof]
    approval: required
    evidence_loop: required
    requires: [contract-a-gate]
    outcomes: [pass, findings, not-applicable, blocked]
  structured-data-enrichment-recovery:
    skill: typo3-structured-data
    phase: P14
    mutation: stateful
    resources: [composer, ddev-stateful, browser-proof]
    approval: required
    outcomes: [pass, blocked]
  webmcp-readiness:
    skill: typo3-webmcp
    phase: P14
    mutation: code
    resources: [browser-proof]
    approval: required
    evidence_loop: required
    requires: [contract-a-gate]
    outcomes: [pass, findings, not-applicable, blocked]
  webmcp-readiness-recovery:
    skill: typo3-webmcp
    phase: P14
    mutation: code
    resources: [browser-proof]
    approval: required
    outcomes: [pass, blocked]
  elevation-join:
    skill: typo3-upgrade-closure
    phase: P14
    requires: [structured-data-enrichment, webmcp-readiness]
    outcomes: [pass, blocked]
  handover:
    skill: typo3-upgrade-closure
    phase: P15
    outcomes: [pass]
  stopped:
    phase: P15
    outcomes: [blocked]

edges:
  - { id: intake-pass, from: intake, outcome: pass, to: [project-identity, dataset-freshness, extension-inventory, url-discovery, backend-group-model-decision, structured-data-inventory, webmcp-inventory] }
  - { id: intake-blocked, from: intake, outcome: blocked, to: stopped }
  - { id: identity-pass, from: project-identity, outcome: pass, to: intake-join }
  - { id: identity-findings, from: project-identity, outcome: findings, to: identity-recovery }
  - { id: identity-blocked, from: project-identity, outcome: blocked, to: stopped }
  - { id: identity-retry, from: identity-recovery, outcome: pass, to: project-identity, retry: true, max_traversals: 2 }
  - { id: identity-recovery-blocked, from: identity-recovery, outcome: blocked, to: stopped }
  - { id: dataset-pass, from: dataset-freshness, outcome: pass, to: intake-join }
  - { id: dataset-findings, from: dataset-freshness, outcome: findings, to: data-recovery }
  - { id: dataset-blocked, from: dataset-freshness, outcome: blocked, to: stopped }
  - { id: data-retry, from: data-recovery, outcome: pass, to: dataset-freshness, retry: true, max_traversals: 2 }
  - { id: data-recovery-blocked, from: data-recovery, outcome: blocked, to: stopped }
  - { id: inventory-pass, from: extension-inventory, outcome: pass, to: intake-join }
  - { id: inventory-blocked, from: extension-inventory, outcome: blocked, to: stopped }
  - { id: discovery-pass, from: url-discovery, outcome: pass, to: intake-join }
  - { id: discovery-findings, from: url-discovery, outcome: findings, to: sitemap-recovery }
  - { id: discovery-blocked, from: url-discovery, outcome: blocked, to: stopped }
  - { id: group-model-single, from: backend-group-model-decision, outcome: pass, to: redirects-rights-single-group }
  - { id: group-model-preserve, from: backend-group-model-decision, outcome: not-applicable, to: redirects-rights-preserved-groups }
  - { id: group-model-blocked, from: backend-group-model-decision, outcome: blocked, to: stopped }
  - { id: structured-inventory-pass, from: structured-data-inventory, outcome: pass, to: intake-join }
  - { id: structured-inventory-blocked, from: structured-data-inventory, outcome: blocked, to: stopped }
  - { id: webmcp-inventory-pass, from: webmcp-inventory, outcome: pass, to: intake-join }
  - { id: webmcp-inventory-blocked, from: webmcp-inventory, outcome: blocked, to: stopped }
  - { id: sitemap-fixed, from: sitemap-recovery, outcome: pass, to: url-discovery, retry: true, max_traversals: 2 }
  - { id: sitemap-degraded, from: sitemap-recovery, outcome: not-applicable, to: degraded-discovery }
  - { id: sitemap-blocked, from: sitemap-recovery, outcome: blocked, to: stopped }
  - { id: degraded-pass, from: degraded-discovery, outcome: pass, to: url-discovery, retry: true, max_traversals: 1 }
  - { id: degraded-blocked, from: degraded-discovery, outcome: blocked, to: stopped }
  - { id: intake-joined, from: intake-join, outcome: pass, to: deterministic-baseline }
  - { id: intake-join-blocked, from: intake-join, outcome: blocked, to: stopped }
  - { id: baseline-pass, from: deterministic-baseline, outcome: pass, to: dependency-plan }
  - { id: baseline-invalid, from: deterministic-baseline, outcome: invalid, to: determinism-recovery }
  - { id: baseline-harness, from: deterministic-baseline, outcome: harness-error, to: harness-recovery }
  - { id: baseline-blocked, from: deterministic-baseline, outcome: blocked, to: stopped }
  - { id: determinism-retry, from: determinism-recovery, outcome: pass, to: deterministic-baseline, retry: true, max_traversals: 2 }
  - { id: determinism-blocked, from: determinism-recovery, outcome: blocked, to: stopped }
  - { id: harness-retry, from: harness-recovery, outcome: pass, to: deterministic-baseline, retry: true, max_traversals: 2 }
  - { id: harness-blocked, from: harness-recovery, outcome: blocked, to: stopped }
  - { id: dependencies-pass, from: dependency-plan, outcome: pass, to: rung-13 }
  - { id: dependencies-findings, from: dependency-plan, outcome: findings, to: dependency-resolution }
  - { id: dependencies-blocked, from: dependency-plan, outcome: blocked, to: stopped }
  - { id: dependency-retry, from: dependency-resolution, outcome: pass, to: dependency-plan, retry: true, max_traversals: 2 }
  - { id: dependency-resolution-blocked, from: dependency-resolution, outcome: blocked, to: stopped }
  - { id: rung13-pass, from: rung-13, outcome: pass, to: mechanical-migration }
  - { id: rung13-findings, from: rung-13, outcome: findings, to: rung13-recovery }
  - { id: rung13-blocked, from: rung-13, outcome: blocked, to: stopped }
  - { id: mechanical-pass, from: mechanical-migration, outcome: pass, to: manual-migration }
