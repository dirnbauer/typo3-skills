  - { id: markup-http-retry, from: markup-recovery, outcome: http, to: http-dom-proof, retry: true, max_traversals: 2 }
  - { id: markup-visual-retry, from: markup-recovery, outcome: visual, to: visual-proof, retry: true, max_traversals: 2 }
  - { id: markup-blocked, from: markup-recovery, outcome: blocked, to: stopped }
  - { id: visual-pass, from: visual-proof, outcome: pass, to: closure-join }
  - { id: visual-findings, from: visual-proof, outcome: findings, to: visual-classify }
  - { id: visual-invalid, from: visual-proof, outcome: invalid, to: closure-harness-recovery }
  - { id: visual-harness, from: visual-proof, outcome: harness-error, to: closure-harness-recovery }
  - { id: visual-blocked, from: visual-proof, outcome: blocked, to: stopped }
  - { id: visual-css, from: visual-classify, outcome: css, to: css-recovery }
