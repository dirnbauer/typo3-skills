  - { id: rights-preserved-pass, from: redirects-rights-preserved-groups, outcome: pass, to: redirects-rights-merge }
  - { id: rights-preserved-blocked, from: redirects-rights-preserved-groups, outcome: blocked, to: stopped }
  - { id: rights-merged, from: redirects-rights-merge, outcome: pass, to: migration-join }
  - { id: rights-merge-blocked, from: redirects-rights-merge, outcome: blocked, to: stopped }
  - { id: rte-pass, from: rte-visual-editor, outcome: pass, to: migration-join }
  - { id: rte-na, from: rte-visual-editor, outcome: not-applicable, to: migration-join }
  - { id: rte-blocked, from: rte-visual-editor, outcome: blocked, to: stopped }
  - { id: migration-joined, from: migration-join, outcome: pass, to: target-content-epoch }
