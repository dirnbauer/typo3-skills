  - { id: structured-parity-pass, from: structured-data-parity, outcome: pass, to: migration-join }
  - { id: structured-parity-findings, from: structured-data-parity, outcome: findings, to: structured-data-recovery }
  - { id: structured-parity-na, from: structured-data-parity, outcome: not-applicable, to: migration-join }
  - { id: structured-parity-blocked, from: structured-data-parity, outcome: blocked, to: stopped }
  - { id: structured-parity-retry, from: structured-data-recovery, outcome: pass, to: structured-data-parity, retry: true, max_traversals: 2 }
  - { id: structured-recovery-blocked, from: structured-data-recovery, outcome: blocked, to: stopped }
  - { id: webmcp-parity-pass, from: webmcp-parity, outcome: pass, to: migration-join }
  - { id: webmcp-parity-findings, from: webmcp-parity, outcome: findings, to: webmcp-recovery }
  - { id: webmcp-parity-na, from: webmcp-parity, outcome: not-applicable, to: migration-join }
  - { id: webmcp-parity-blocked, from: webmcp-parity, outcome: blocked, to: stopped }
  - { id: webmcp-parity-retry, from: webmcp-recovery, outcome: pass, to: webmcp-parity, retry: true, max_traversals: 2 }
  - { id: webmcp-recovery-blocked, from: webmcp-recovery, outcome: blocked, to: stopped }
  - { id: rights-single-pass, from: redirects-rights-single-group, outcome: pass, to: redirects-rights-merge }
